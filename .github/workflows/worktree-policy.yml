name: Worktree policy
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check committed operational-data policy
        run: python3 worktrees/repository_policy.py .
      - name: Verify upstream artifact digests
        run: python3 -c 'import sys; sys.path.insert(0, "worktrees"); import audit; audit.verify_source()'
      - name: Run behavioral guard and hook composition tests
        run: python3 -m unittest discover -s worktrees -p 'test_*.py'
